    .rim { fill: #f6cd39; }
    .glyph { fill: #fff06a; font-weight: bold; }
    #spin:target .coin-face {
      animation: flip 4s linear infinite;
    }
    @keyframes flip {
      from { transform: perspective(650px) rotateY(0turn); }
      to { transform: perspective(650px) rotateY(1turn); }
    }
  </style>
